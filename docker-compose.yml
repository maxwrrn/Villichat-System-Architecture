services:
  backend:
    build: ./backend
    container_name: lia-backend
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./backend/app:/app/app
      - ./backend/.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: lia-frontend
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules             # keep node_modules inside the container
      - ./frontend/.env.local:/app/.env.local:ro
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
